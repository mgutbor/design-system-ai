name: Release

# Workflow de release basado en Changesets (F6). Independiente del CI normal:
# - El CI (ci.yml) valida el código en cada push/PR sin publicar nada.
# - Este workflow se ejecuta SOLO MANUALMENTE (workflow_dispatch): un push a
#   main NUNCA dispara una publicación. El primer release es manual y
#   controlado; la automatización de releases futuros se decide después.
#   1. Si hay changesets pendientes → crea/actualiza el PR "Version Packages"
#      (changesets/action con `version`).
#   2. Si no hay changesets pendientes → publica las versiones actuales en
#      npm (`publish`), p. ej. el primer release de 0.1.0.
#
# Publicación mediante npm Trusted Publishing (OIDC): `npm publish` se
# autentica con el token OIDC de GitHub Actions (permissions.id-token: write)
# intercambiado por npm. No se utiliza ningún secreto de npm; NPM_TOKEN no
# forma parte del proceso. Ningún secreto se almacena en el repositorio.

on:
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version & publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # changesets/action: push de versiones y tags
      pull-requests: write # changesets/action: PR "Version Packages"
      id-token: write # OIDC: emisión del token para npm Trusted Publishing
    steps:
      - uses: actions/checkout@v4

      # La versión de pnpm se lee de `packageManager` en package.json
      # (pnpm@10.34.5) — fuente de verdad única; no se declara `version` aquí.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # >= 22.14.0 (requisito de trusted publishing)
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Los tarballs de publicación necesitan dist/ (tokens generados, react
      # compilado). El CI normal ya valida el build; aquí lo regeneramos para
      # garantizar que lo publicado coincide con el código de main.
      - name: Build
        run: pnpm build

      # Trusted publishing (OIDC) requiere npm CLI >= 11.5.1; el npm incluido
      # con Node 22 es 10.x, por lo que se actualiza explícitamente.
      - name: Ensure npm >= 11.5.1 for trusted publishing
        run: npm install -g npm@latest

      # Sin NPM_TOKEN: npm publish se autentica con el token OIDC de GitHub
      # (id-token: write) intercambiado por npm. No se usa `registry-url` en
      # setup-node para evitar generar un _authToken que interfiera con OIDC.
      - name: Create Release Pull Request or Publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Evidencia explícita del resultado de changesets/action en los logs.
      - name: Show publish result
        run: |
          echo "published: ${{ steps.changesets.outputs.published }}"
          echo "publishedPackages: ${{ steps.changesets.outputs.publishedPackages }}"
          echo "hasChangesets: ${{ steps.changesets.outputs.hasChangesets }}"
