name: Release

# Workflow de release basado en Changesets (F6). Independiente del CI normal:
# - El CI (ci.yml) valida el código en cada push/PR sin publicar nada.
# - Este workflow se ejecuta SOLO en push a main:
#   1. Si hay changesets pendientes → crea/actualiza el PR "Version Packages"
#      (changesets/action con `version`).
#   2. Al fusionar (o si no hay changesets pendientes) → publica los paquetes
#      versionados en npm (`publish`).
#
# Requiere un secreto de GitHub: NPM_TOKEN (token de npm con permiso de
# publicación). Ningún secreto se almacena en el repositorio.

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Version & publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Los tarballs de publicación necesitan dist/ (tokens generados, react
      # compilado). El CI normal ya valida el build; aquí lo regeneramos para
      # garantizar que lo publicado coincide con el código de main.
      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
